<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Linear Gradient for Accents -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.0)"/>
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.35)"/>
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Behind Text) -->

  <!-- Animated Glowing Spheres -->
  <circle cx="150" cy="80" r="100" fill="#6366f1" opacity="0.15">
    <animate attributeName="r" values="80;110;80" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1050" cy="280" r="120" fill="#ec4899" opacity="0.15">
    <animate attributeName="r" values="100;130;100" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated Sales Trend Line Graph (Background Accent) -->
  <g opacity="0.4" filter="url(#glow)">
    <!-- Filled area below graph -->
    <path d="M 60 300 Q 300 240 500 260 T 900 140 T 1140 100 L 1140 320 L 60 320 Z" fill="url(#chartGrad)"/>
    
    <!-- Animated Line Path -->
    <path d="M 60 300 Q 300 240 500 260 T 900 140 T 1140 100" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0,1500;1500,0" dur="5s" repeatCount="indefinite"/>
    </path>

    <!-- Pulsing Data Nodes -->
    <circle cx="500" cy="260" r="6" fill="#a855f7">
      <animate attributeName="r" values="4;9;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="140" r="6" fill="#ec4899">
      <animate attributeName="r" values="4;9;4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="100" r="8" fill="#38bdf8">
      <animate attributeName="r" values="6;11;6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Animated Floating SPM Metrics Pill Badges (Background Right Side) -->
  <g opacity="0.25">
    <rect x="820" y="50" width="160" height="36" rx="18" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)">
      <animate attributeName="y" values="50;42;50" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="900" y="73" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🎯 Quota Attainment</text>

    <rect x="940" y="190" width="180" height="36" rx="18" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)">
      <animate attributeName="y" values="190;198;190" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="1030" y="213" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">💰 Commission Engine</text>
  </g>

  <!-- FOREGROUND CONTENT LAYER (Sharp & Visible) -->
  <g text-anchor="middle">
    <!-- Top Pill Tag -->
    <rect x="420" y="42" width="360" height="32" rx="16" fill="rgba(99, 102, 241, 0.25)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="600" y="63" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">AWESOME SALES PERFORMANCE MANAGEMENT</text>

    <!-- Main Title (Pulsing Glow) -->
    <text x="600" y="145" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">
      Sales Performance Management
    </text>

    <!-- Gradient Subtitle / Category Focus -->
    <text x="600" y="195" fill="url(#accentGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">
      SaaS Platforms • Open-Source Commission Calculation • Quota Automation
    </text>

    <!-- Decorative Divider Line -->
    <line x1="450" y1="225" x2="750" y2="225" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Bottom Highlights Row -->
    <text x="600" y="265" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500">
      Enterprise ICM Suites • Incentive Compensation • Multi-Party Revenue Splits • Territory Design
    </text>
  </g>
</svg>
